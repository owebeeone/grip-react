name: Publish grip-react to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --silent
      - run: pnpm build
      - name: Smoke-test packed consumer install
        run: |
          source_dir="$PWD"
          package_dir=$(mktemp -d)
          pnpm pack --pack-destination "$package_dir"
          package_tarball="owebeeone-grip-react-$(node -p "require('./package.json').version").tgz"
          mkdir "$package_dir/consumer"
          cd "$package_dir/consumer"
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          pnpm add "$package_dir/$package_tarball" react@19 react-dom@19 typescript@5.9.3 @types/react@19 @types/react-dom@19
          node --input-type=module -e "const m = await import('@owebeeone/grip-react'); for (const key of ['GripScope', 'GripInput', 'useGrip', 'Grok']) { if (!m[key]) throw new Error('missing ESM export: ' + key); }"
          node -e "const m = require('@owebeeone/grip-react'); for (const key of ['GripScope', 'GripInput', 'useGrip', 'Grok']) { if (!m[key]) throw new Error('missing CJS export: ' + key); }"
          cp "$source_dir/scripts/release-smoke.tsx" check.tsx
          pnpm exec tsc --noEmit --strict --module nodenext --target ES2021 --jsx react-jsx --skipLibCheck false check.tsx
          pnpm exec tsc --noEmit --strict --module node16 --target ES2021 --jsx react-jsx --skipLibCheck false check.tsx

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Require tag/package version agreement
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.RELEASE_TAG.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      - run: pnpm build
      - name: Publish with npm trusted publishing if this version is absent
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          if pnpm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            npm publish --access public
          fi
